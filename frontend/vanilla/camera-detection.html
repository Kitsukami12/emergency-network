<body class="bg-background font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary">
  <aside class="fixed left-0 top-0 h-full w-[72px] bg-surface-container-low z-50 flex flex-col justify-between py-space-md border-r border-surface-container-highest shadow-[0_1px_8px_rgba(0,0,0,0.5)]">
    <div class="flex flex-col items-center gap-space-lg w-full">
      <div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center border border-surface-container-high">
        <span class="material-symbols-outlined text-primary text-[22px]">local_fire_department</span>
      </div>
      <nav class="flex flex-col items-center gap-space-xs w-full px-space-xs" data-active-classes="bg-surface-container-high text-primary border-l-2 border-primary-container shadow-[0_0_12px_rgba(34,211,238,0.25)]">
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" href="command-center.html" title="Command Center">
          <span class="material-symbols-outlined text-[20px]">grid_view</span>
        </a>
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-high text-primary border-l-2 border-primary-container shadow-[0_0_12px_rgba(34,211,238,0.25)] transition-all" href="camera-detection.html" title="Camera &amp; Detection">
          <span class="material-symbols-outlined text-[20px]">videocam</span>
        </a>
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" href="hospital-portal.html" title="Hospital Portal">
          <span class="material-symbols-outlined text-[20px]">local_hospital</span>
        </a>
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" href="simulation-lab.html" title="Simulation Lab">
          <span class="material-symbols-outlined text-[20px]">science</span>
        </a>
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" href="analytics.html" title="Analytics">
          <span class="material-symbols-outlined text-[20px]">monitoring</span>
        </a>
        <a class="group relative flex items-center justify-center w-12 h-12 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" href="about.html" title="About &amp; Limitations">
          <span class="material-symbols-outlined text-[20px]">info</span>
        </a>
      </nav>
    </div>
    <div class="flex flex-col items-center gap-space-sm w-full px-space-xs border-t border-surface-container-high pt-space-md">
      <button class="flex items-center justify-center w-10 h-10 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" title="System Diagnostics" type="button">
        <span class="material-symbols-outlined text-[18px]">tune</span>
      </button>
      <button class="flex items-center justify-center w-10 h-10 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-all" title="Audio Alerts Matrix" type="button">
        <span class="material-symbols-outlined text-[18px]">volume_up</span>
      </button>
    </div>
  </aside>
  <div class="pl-[72px]">
    <header class="fixed top-0 left-[72px] right-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-surface-container-highest">
      <div class="h-16 w-full px-gutter flex items-center justify-between gap-space-md">
        <div class="flex items-center gap-space-md min-w-0">
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-space-xs">
              <span class="font-title-sm text-title-sm text-on-surface uppercase tracking-wider font-semibold truncate">AI Emergency Response Network</span>
            </div>
            <span class="font-mono-data-sm text-mono-data-sm text-outline tracking-wider uppercase">INDORE METRO • SECTOR 4</span>
          </div>
        </div>
        <div class="flex items-center gap-space-md shrink-0">
          <div class="hidden sm:flex flex-col text-right">
            <span class="font-body-sm text-body-sm text-on-surface font-semibold leading-tight">A. Sharma (Lead Dispatcher)</span>
            <span class="font-mono-data-sm text-mono-data-sm text-primary-container font-medium tracking-wide uppercase">ON DUTY</span>
          </div>
          <img alt="Profile" class="w-8 h-8 rounded-full object-cover ring-1 ring-primary/40" src="assets/avatar.svg" />
        </div>
      </div>
    </header>
    <main class="w-full pt-16 bg-background min-h-screen">
      <div class="flex flex-col w-full text-on-surface p-space-md">
        <!-- Camera Detection Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-md items-start">
          <!-- Left column: Video upload and controls -->
          <section class="lg:col-span-4 bg-surface-container-low rounded-xl p-space-md flex flex-col gap-space-md shadow-lg">
            <h2 class="font-title-sm text-title-sm text-on-surface font-semibold">Upload Video</h2>
            <input type="file" accept="video/*" id="video-input" class="border border-surface-container-high rounded p-2" />
            <video id="preview-video" class="w-full rounded" controls></video>
          </section>
          <!-- Center column: Verification Queue -->
          <section class="lg:col-span-5 bg-surface-container-low rounded-xl p-space-md flex flex-col gap-space-md shadow-lg">
            <h2 class="font-title-sm text-title-sm text-on-surface font-semibold">Verification Queue</h2>
            <div id="verification-queue" class="flex flex-col gap-space-sm"></div>
          </section>
          <!-- Right column: Details / results -->
          <section class="lg:col-span-3 bg-surface-container-low rounded-xl p-space-md flex flex-col gap-space-md shadow-lg">
            <h2 class="font-title-sm text-title-sm text-on-surface font-semibold">Detection Details</h2>
            <div id="detection-details" class="flex flex-col gap-space-sm"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="camera-detection.js"></script>
